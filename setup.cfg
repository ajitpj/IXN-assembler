[metadata]
name = IXN-assembler
version = 0.0.1
author = Ajit Joglekar
lisence = MIT

classifiers =
    Framework :: napari
    Programming Language :: Python :: 3

[options]
packages = find:
include_package_data = False
python_requires  = >= 3.8
install_requires =
    napari

[options.entry_points]
napari.manifest =
    IXN-assembler = IXN_assembler:napari.yaml

[options.package_data]
* = *.yaml
